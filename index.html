<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fredrik Bertilsson</title>
<style>
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url(forhandsvisning/fonts/newsreader-latin-opsz-normal.woff2) format("woff2")}
:root{--bg:#F5F6F3;--ink:#1E2428;--muted:#5B656B;--accent:#2C5A66;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191B;--ink:#E4E7E5;--muted:#98A2A6;--accent:#8DB7C2;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;display:flex;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box}
main{max-width:30rem}
h1{font-weight:400;font-size:2rem;margin:0 0 .25rem}
p{margin:0 0 .5rem;color:var(--muted);font-size:1.15rem;line-height:1.5}
.lead{margin-top:2rem;color:var(--ink)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Fredrik Bertilsson</h1>
<p>Forskare, KTH</p>
<p class="lead">Webbplatsen öppnar snart.</p>
<p lang="en">The website is coming soon.</p>

</main>
</body>
</html>
